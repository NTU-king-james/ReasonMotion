project:
  name: "0428_base_rl_h36m_10_10"
  output_dir: "runs/0428_base_rl_h36m_10_10"

pretrained_ckpt: "/home/kingjames23/ReasonMotion/predictor/runs/base_h36m_10_10/checkpoints/model_ep41.pth" # <-- 請替換為您的 H36M MoE SFT 模型

data:
  all_data: true
  data_dir: /home/allen/datasets
  data_ratio: 1.0
  dataset: h36m
  downsample: 2
  h36m_protocol: deposit
  input_n: 10
  joints: 22
  miss_rate: 0.2
  miss_type: no_miss
  no_overlap: false
  output_n: 10
  pad_short_sequences: false
  skip_rate: 1
  split: 0

diffusion:
  beta_end: 0.5
  beta_start: 0.0001
  channels: 64
  diffusion_embedding_dim: 128
  layers: 12
  nheads: 8
  num_steps: 50
  schedule: cosine
  moe: False

model:
  target_dim: 66
  balance_loss: False
  balance_loss_weight: 0.01
  multirouter: false
  featureemb: 16
  is_unconditional: 0
  text_encoder: sentence-transformer
  text_mode: cross_attn
  textemb: 384
  timeemb: 128
  use_r3: False

rl:
  lr: 1e-5                
  batch_size: 8          
  num_samples_per_prompt: 8  
  diffusion_steps: 50     

  # Visualization Params
  vis_target_path: null
  vis_top_k: 1          
  vis_bot_k: 1          
  viz_mode: "all"       

  sampling_std: 0.015
  
  # 獎勵權重 0.7 GT + 0.3 Smooth
  w_gt: 0.7         
  w_smooth: 0.3    
  w_score: 0.0            
  w_righthand: 0.0        
  w_rot: 0.0           
  rot_threshold: 0    

  kl_coef: 0.003          
  kl_clip_value: 0.2

  save_checkpoint_every: 100    
  visualize_every: 400          
  update_ref_every_batch: 200

text_injection:
  decouple_spatial_temporal: false
  use_clip_encoder: false
  use_deep_text_projector: false
  use_late_injection: false
  use_time_aware_film: false

grad_clip: 1.0