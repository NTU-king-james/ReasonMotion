project:
  name: "h36m_fairscale_rl"
  output_dir: "./runs/h36m_fairscale_rl"

pretrained_ckpt: "/home/kingjames23/ReasonMotion/predictor/runs/fairscale_h36m_25_100/checkpoints/model_ep16.pth" # <-- 請替換為您的 H36M MoE SFT 模型

data:
  all_data: true
  data_dir: /home/allen/datasets
  data_ratio: 1.0
  dataset: h36m
  downsample: 1
  h36m_protocol: deposit
  input_n: 25
  joints: 17
  miss_rate: 0.2
  miss_type: no_miss
  no_overlap: false
  output_n: 100
  pad_short_sequences: false
  skip_rate: 1
  split: 0

diffusion:
  beta_end: 0.5
  beta_start: 0.0001
  channels: 64
  diffusion_embedding_dim: 128
  layers: 12
  nheads: 8
  num_steps: 50
  schedule: cosine
  moe: fairscale_rl

model:
  target_dim: 51  
  balance_loss: true
  balance_loss_weight: 0.01
  multirouter: false
  featureemb: 16
  is_unconditional: 0
  text_mode: cross_attn
  textemb: 384
  timeemb: 128
  use_r3: true            # Strategy C — Detached Single-Step R3
  use_rot_loss: false

rl:
  lr: 1e-5                
  batch_size: 2          
  num_samples_per_prompt: 8  
  diffusion_steps: 50     

  # Visualization Params
  vis_target_path: null
  vis_top_k: 1          
  vis_bot_k: 1          
  viz_mode: "all"       

  sampling_std: 0.02
  
  # 獎勵權重 0.7 GT + 0.3 Smooth
  w_gt: 1.0             
  w_smooth: 0          
  w_score: 0.0            
  w_righthand: 0.0        
  w_rot: 0.0           
  rot_threshold: 0    

  kl_coef: 0.01          
  kl_clip_value: 0.2

  save_checkpoint_every: 250    
  visualize_every: 1000          
  update_ref_every_batch: 1000

text_injection:
  decouple_spatial_temporal: false
  use_clip_encoder: false
  use_deep_text_projector: false
  use_late_injection: false
  use_time_aware_film: false

grad_clip: 1.0