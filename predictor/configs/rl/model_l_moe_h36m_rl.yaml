project:
  name: "0501_moe_rl_h36m_smooth_guard"
  output_dir: "runs/0501_moe_rl_h36m_smooth_guard"

pretrained_ckpt: "/home/kingjames23/ReasonMotion-project/ReasonMotion/predictor/runs/moe_h36m_10_10/checkpoints/model_ep23.pth" # <-- 請替換為您的 H36M MoE SFT 模型

data:
  all_data: true
  data_dir: /home/allen/datasets
  data_ratio: 1.0
  dataset: h36m
  downsample: 2
  h36m_protocol: deposit
  input_n: 10
  joints: 22
  miss_rate: 0.2
  miss_type: no_miss
  no_overlap: false
  output_n: 10
  pad_short_sequences: false
  skip_rate: 1
  split: 0

diffusion:
  beta_end: 0.5
  beta_start: 0.0001
  channels: 64
  diffusion_embedding_dim: 128
  layers: 12
  nheads: 8
  num_steps: 50
  schedule: cosine
  moe: fairscale_rl

model:
  target_dim: 66  
  balance_loss: true
  balance_loss_weight: 0.01
  multirouter: false
  featureemb: 16
  is_unconditional: 0
  text_mode: cross_attn
  textemb: 384
  timeemb: 128
  use_r3: true            # Strategy C — Detached Single-Step R3
  use_rot_loss: false

rl:
  ref_ckpt: null           # Fixed KL ref; null falls back to top-level pretrained_ckpt. Set explicitly when resuming RL.
  lr: 3e-6                
  batch_size: 8          
  num_samples_per_prompt: 16  
  diffusion_steps: 50     
  max_train_batches: 1000   # short-run guard for the smoothness-collapse test

  # Visualization Params
  vis_target_path: null
  vis_top_k: 1          
  vis_bot_k: 1          
  viz_mode: "all"       

  sampling_std: 0.015
  
  # Smoothness-first reward: let GT move slightly if needed to preserve smooth motion.
  w_gt: 0.45             
  w_smooth: 0.55
  smooth_floor: 0.85
  smooth_floor_penalty: 1.0
  w_score: 0.0            
  w_righthand: 0.0        
  w_rot: 0.0           
  rot_threshold: 0    

  epsilon: 0.1           # PPO/GRPO clipped ratio range
  ppo_epochs: 1          # Conservative update: one pass per rollout
  kl_coef: 0.01         
  kl_clip_value: 0.2

  save_checkpoint_every: 100    
  visualize_every: 400          
  update_ref_every_batch: null    # Fixed-reference KL uses pretrained/base model

text_injection:
  decouple_spatial_temporal: false
  use_clip_encoder: false
  use_deep_text_projector: false
  use_late_injection: false
  use_time_aware_film: false

grad_clip: 1.0
